name: Elfaris Watch Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify packaged Android ABIs
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          echo "Native libraries packaged in $APK:"
          unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' | sort -u
          unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/' || { echo 'Missing ARMv7 (32-bit) native libraries'; exit 1; }
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/' || { echo 'Missing ARM64 native libraries'; exit 1; }
          if unzip -Z1 "$APK" | grep -q '^lib/armeabi/'; then
            echo 'Legacy ARMv6 ABI (armeabi) libraries detected.'
          else
            echo 'ARMv6 (armeabi) libraries are not packaged; this APK does not support ARMv6 devices.'
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: elfaris-watch-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decode release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: app/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          VERSION="${GITHUB_REF_NAME#v}"
          gradle --no-daemon --stacktrace -PversionName="$VERSION" assembleRelease
          cp app/build/outputs/apk/release/app-release.apk elfaris-watch.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: elfaris-watch.apk
